openapi: 3.1.0
info:
  title: Trading Journal API
  version: 1.0.0
  description: |
    Feature 001 API contract for manually recording one completed stock trade
    and returning its calculated performance.

paths:
  /api/v1/trades:
    post:
      summary: Record a completed stock trade
      description: |
        Records one completed stock trade entered manually by the user.

        The backend is authoritative for validation, ticker normalization,
        performance calculation, and persistence.

        Repeated identical valid submissions are allowed. Each successful
        submission creates a separate Trade with its own generated identifier.
      operationId: createTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTradeRequest'
            examples:
              profitableLong:
                summary: Profitable LONG trade
                value:
                  ticker: "  aapl  "
                  tradeType: LONG
                  entryDate: "2026-09-01"
                  entryPrice: 220.0000
                  exitDate: "2026-09-15"
                  exitPrice: 230.0000
                  numberOfShares: 10.000000
      responses:
        '201':
          description: Trade recorded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeResponse'
              examples:
                profitableLong:
                  summary: Recorded profitable LONG trade
                  value:
                    id: 1
                    ticker: AAPL
                    tradeType: LONG
                    entryDate: "2026-09-01"
                    entryPrice: 220.0000
                    exitDate: "2026-09-15"
                    exitPrice: 230.0000
                    numberOfShares: 10.000000
                    dollarPnl: 100.00
                    percentageReturn: 4.5455
        '400':
          description: |
            Validation failure. The trade is not persisted.

            Human-readable validation wording is not frozen by Feature 001.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                invalidEntryPrice:
                  summary: Invalid submitted value
                  value:
                    message: Validation failed
                    fieldErrors:
                      entryPrice: Entry price must be greater than zero
        '500':
          description: |
            Unexpected technical or persistence failure that prevents successful
            completion. The response must not expose stack traces, credentials,
            secrets, or sensitive runtime details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalErrorResponse'
              examples:
                technicalFailure:
                  value:
                    message: Unable to record trade

components:
  schemas:
    TradeType:
      type: string
      enum:
        - LONG
        - SHORT

    CreateTradeRequest:
      type: object
      additionalProperties: false
      required:
        - ticker
        - tradeType
        - entryDate
        - entryPrice
        - exitDate
        - exitPrice
        - numberOfShares
      properties:
        ticker:
          type: string
          description: Required stock ticker. Trim surrounding whitespace, reject blank values, and normalize to uppercase.
        tradeType:
          $ref: '#/components/schemas/TradeType'
        entryDate:
          type: string
          format: date
          description: |
            Required ISO local date in YYYY-MM-DD form.
        entryPrice:
          type: number
          exclusiveMinimum: 0
          description: Entry price. Must be greater than zero and use at most 4 fractional decimal places.
        exitDate:
          type: string
          format: date
          description: |
            Required ISO local date in YYYY-MM-DD form. Must be greater than or
            equal to entryDate; same-day trades are valid.
        exitPrice:
          type: number
          exclusiveMinimum: 0
          description: Exit price. Must be greater than zero and use at most 4 fractional decimal places.
        numberOfShares:
          type: number
          exclusiveMinimum: 0
          description: Share quantity. Must be greater than zero; fractional shares are allowed up to 6 decimal places.

    TradeResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - ticker
        - tradeType
        - entryDate
        - entryPrice
        - exitDate
        - exitPrice
        - numberOfShares
        - dollarPnl
        - percentageReturn
      properties:
        id:
          type: integer
          format: int64
          description: Generated Trade identifier.
        ticker:
          type: string
          description: Normalized authoritative ticker value.
        tradeType:
          $ref: '#/components/schemas/TradeType'
        entryDate:
          type: string
          format: date
        entryPrice:
          type: number
          description: Accepted authoritative entry price.
        exitDate:
          type: string
          format: date
        exitPrice:
          type: number
          description: Accepted authoritative exit price.
        numberOfShares:
          type: number
          description: Accepted authoritative share quantity.
        dollarPnl:
          type: number
          description: Derived dollar profit/loss serialized to 2 decimal places using HALF_UP.
        percentageReturn:
          type: number
          description: Derived percentage return serialized to 4 decimal places using HALF_UP after authoritative BigDecimal division at intermediate scale 10 with HALF_UP.

    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - fieldErrors
      properties:
        message:
          type: string
          description: |
            User-meaningful validation summary. Exact human-readable wording is
            intentionally not frozen.
        fieldErrors:
          type: object
          description: |
            Associates invalid request field names with user-meaningful
            validation messages. Exact human-readable wording is intentionally
            not frozen.
          additionalProperties:
            type: string

    TechnicalErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          description: Client-safe technical error message with no internal or sensitive runtime details.
