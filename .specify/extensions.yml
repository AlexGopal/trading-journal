installed:
- agent-context
- review-profiles
settings:
  auto_execute_hooks: true
hooks:
  after_specify:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after specification
    condition: null
  after_plan:
  - extension: agent-context
    command: speckit.agent-context.update
    enabled: true
    optional: true
    priority: 10
    prompt: Execute speckit.agent-context.update?
    description: Refresh agent context after planning
    condition: null
  after_implement:
  - extension: review-profiles
    command: speckit.review-profiles.review
    enabled: true
    optional: true
    priority: 10
    prompt: Run review gate now?
    description: Run profile-based code review after implementation
    condition: null
