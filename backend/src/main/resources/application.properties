# Load the shared local configuration when launched from backend/ or the repository root.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# DB_* overrides remain supported for existing launch configurations.
spring.datasource.url=${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:trading_journal}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:trading_journal}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true

logging.level.root=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
